<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login Sistem Keuangan La Tahzan Citeras</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5048e5",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="font-display antialiased text-slate-900 bg-background-light dark:bg-background-dark">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center overflow-hidden">
<div class="relative z-10 w-full max-w-[440px] px-6">
<div class="flex flex-col items-center rounded-2xl bg-white p-10 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 dark:bg-slate-900 dark:border-slate-800">
<div class="mb-8 flex h-12 w-12 items-center justify-center rounded-xl bg-primary/5 text-primary">
<span class="material-symbols-outlined" style="font-size: 28px;">account_balance_wallet</span>
</div>
<div class="text-center mb-10">
<h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">
                    Sistem Keuangan
                </h1>
<p class="mt-1 text-sm font-medium text-slate-500 dark:text-slate-400">
                    Yayasan La Tahzan Citeras
                </p>
</div>
<form class="w-full flex flex-col gap-6">
<div class="group relative">
<label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400" for="username">Username</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-slate-400">
<span class="material-symbols-outlined" style="font-size: 18px;">person</span>
</span>
<input class="w-full rounded-lg border border-slate-200 bg-white px-4 py-3 pl-11 text-sm text-slate-900 placeholder-slate-400 transition-all focus:border-primary focus:outline-none focus:ring-0 dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder-slate-500" id="username" placeholder="Enter username" type="text"/>
</div>
</div>
<div class="group relative">
<div class="flex justify-between items-center mb-2">
<label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:text-primary/80" href="#">
                            Forgot password?
                        </a>
</div>
<div class="relative flex items-center">
<span class="absolute left-4 text-slate-400">
<span class="material-symbols-outlined" style="font-size: 18px;">lock</span>
</span>
<input class="w-full rounded-lg border border-slate-200 bg-white px-4 py-3 pl-11 pr-11 text-sm text-slate-900 placeholder-slate-400 transition-all focus:border-primary focus:outline-none focus:ring-0 dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder-slate-500" id="password" placeholder="Enter password" type="password"/>
<button class="absolute right-4 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-300" type="button">
<span class="material-symbols-outlined" style="font-size: 18px;">visibility_off</span>
</button>
</div>
</div>
<button class="mt-2 w-full rounded-lg bg-primary py-3.5 text-sm font-bold text-white transition-all hover:bg-primary/90 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary/20">
                    Sign In
                </button>
</form>
<div class="mt-12 text-center">
<p class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-300 dark:text-slate-600">
                    © 2026 Yayasan La Tahzan Citeras
                </p>
</div>
</div>
</div>
</div>
</body></html>
